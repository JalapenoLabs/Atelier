name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      # uv reads the exact Python from .python-version and installs it; uv itself is pinned here and in
      # pyproject.toml's `required-version`.
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check

  types:
    name: Python type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run mypy src tests

  tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6.1.0
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.13"
      - run: uv sync --locked
      - run: uv run pytest
